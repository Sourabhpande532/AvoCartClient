<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/shopping-cart.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121932" />
    <meta
      name="description"
      content="AvoCart — Curated Fashion & Lifestyle E-Commerce Store"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/online-shop.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>AVOCART FASHION</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("avocart_theme") || "light";
          document.documentElement.setAttribute("data-bs-theme", savedTheme);
        } catch (e) {}
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
